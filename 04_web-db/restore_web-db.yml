---
#############################
# (ㄱ) 방화벽 포트 제거
# (ㄴ) 서비스 종료
# (ㄷ) 서비스 설정 삭제
# (ㄹ) 패키지 삭제
#############################
#
# 1. play 01: WEB-PHP-DB 구현
#
- name: 1. play 복원 작업
  hosts: webservers
  tasks:
    #     * 방화벽 포트 제거
    - name: 1) 방화벽 서비스(포트) 제거 
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop:
        - http
        - https
        - mysql

    - name: 2) 서비스 종료 
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - httpd
        - mariadb

    - name: 3) 서비스 설정 삭제 
      ansible.builtin.file:
        path: /var/www/html/index.php
        state: absent

    - name: 4) 패키지 삭제
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
          - php
          - php-mysqlnd
          - php-pdo
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: absent


  





