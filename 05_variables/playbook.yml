---
###############################
# Play01 - 웹서버 설정
# 1) 웹 패키지 설치
# 2) 웹 서비스 설정
# 3) 웹 서비스 기동
# 4) 방화벽 등록
# play02 - 웹요청
# 1) 웹요청(웹테스트)
###############################
#
# Play01: 웹서버 설정
#
- name: Play01 - 웹서버 설정
  hosts: webservers
  vars:
    pkg_http: httpd
    pkg_httpd: mod_ssl
    pkg_fw: firewalld
    inx_dest: /var/www/html/index.html
    svc_web: httpd
    svc_fw: firewalld
    fw_80: http
    fw_8080: https
  tasks:  
  # 1) 웹 패키지 설치 - httpd, mod_ssl, firewalld
  - name: 1) 웹 패키지 설치 - "{{ pkg_http }}", "{{ pkg_http }}", "{{ pkg_fw }}"
    ansible.builtin.dnf:
      name:
        - "{{ pkg_http }}"
        - "{{ pkg_http }}"
        - "{{ pkg_fw }}" 
      state: present
  # 2) 웹 서비스 설정 - /var/www/html/index.html
  - name: 2) 웹서비스 설정 - "{{ inx_dest }}"
    ansible.builtin.copy:
      content: "web1.example.com\n"
      dest: "{{ inx_dest }}"
      mode: '0644'

  # 3) 웹 서비스 기동 - httpd, firewalld
  - name: 3) 웹 서비스 기동 - "{{ svc_web }}", "{{ svc_fw }}"
    ansible.builtin.systemd_service:
      name: "{{ item }}"
      state: started
      enabled: true
    loop:
      - "{{ svc_web }}"
      - "{{ svc_fw }}"

  # 4) 방화벽 등록 - http, https
  - name: 4) 방화벽 등록 - "{{ fw_80 }}", "{{ fw_8080 }}" 
    ansible.builtin.firewalld:
      service: "{{ item }}"
      state: enabled
      permanent: true
      immediate: true
    loop:
      - "{{ fw_80 }}"
      - "{{ fw_8080 }}"

#
# play02: 웹요청
#
# 1) 웹요청(웹테스트) - http:// 192.168.10.11
- name: Play01 - 웹요청
  hosts: localhost
  become: false
  vars:
     url_web1: http://192.168.10.11
  tasks:
    # 1) 웹요청(웹테스트) - http:// 192.168.10.11
    - name: 1) 웹요청(웹테스트) - "{{ url_web1 }}"
      ansible.builtin.uri:
        url: "{{ url_web1 }}"
        return_content: true
      register: resp

    - name: 2) HTML reponse
      ansible.builtin.debug:
        var: resp["content"]